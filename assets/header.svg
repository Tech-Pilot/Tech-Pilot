<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Alexander Carr — Tech-Pilot</title>
  <desc id="desc">AI, automation and practical software. A navy banner with a subtle blue geometric motif.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101E33"/>
      <stop offset="1" stop-color="#172F4D"/>
    </linearGradient>
    <linearGradient id="accent" x1="845" y1="60" x2="1100" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5D8FF"/>
      <stop offset="1" stop-color="#4C98E4"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#92B4D5" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="14" fill="url(#background)"/>
  <rect x="760" width="440" height="280" fill="url(#grid)"/>
  <rect x="56" y="49" width="28" height="3" rx="1.5" fill="#8BCBFF"/>
  <text x="98" y="56" fill="#A8C8E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="3">TECH-PILOT</text>
  <text x="56" y="132" fill="#F5F9FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="650" letter-spacing="-1.6">Alexander Carr</text>
  <text x="58" y="181" fill="#C2D4E7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23">AI, automation &amp; practical software.</text>
  <path d="M58 221H696" stroke="#90B4D7" stroke-opacity=".2"/>
  <g transform="translate(988 140)">
