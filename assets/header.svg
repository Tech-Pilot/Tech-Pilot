    <ellipse rx="112" ry="43" transform="rotate(-32)" stroke="url(#accent)" stroke-width="1.5"/>
    <ellipse rx="112" ry="43" transform="rotate(32)" stroke="#91C5F3" stroke-opacity=".4"/>
    <path d="M-121 0H121M0-112V112" stroke="#8EB7DD" stroke-opacity=".14"/>
